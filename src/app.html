<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      type="text/css"
      href="https://unpkg.com/augmented-ui@2/augmented-ui.min.css"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri + SvelteKit + Typescript App</title>
    %sveltekit.head%
    <style>
      :root {
        --void: #000000;
        --panel: #0d1311;
        --panel-soft: #101b16;

        --border-dim: rgba(61, 220, 132, 0.14);
        --border-mid: rgba(61, 220, 132, 0.32);

        --signal: #3ddc84;
        --signal-soft: rgba(61, 220, 132, 0.12);

        --amber: #f5a623;
        --fault: #ff5c5c;

        --ink: #dffbe9;
        --ink-muted: #6c8b7c;
        --ink-dim: #33453c;
      }

      .main-scrollbar {
        scrollbar-color: var(--signal) transparent;
        scrollbar-width: thin;
      }

      .body {
        height: calc(100vh - 2px);
        margin: 0px;
        border: solid 1px var(--signal-soft);
        background: var(--void);
      }

      .font-style {
        font-family: "Orbitron", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-size: small;
      }

      .app {
        display: contents;
      }
    </style>
  </head>

  <body
    data-sveltekit-preload-data="hover"
    class="body font-style"
  >
    <div class="app">%sveltekit.body%</div>
  </body>
</html>
