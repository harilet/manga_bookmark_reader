<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tauri + SvelteKit + Typescript App</title>
    %sveltekit.head%
    <style>
      :root {
        --void: #05070c;
        --panel: #0a0d15;
        --panel-soft: #10141f;

        --border-dim: rgba(255, 255, 255, 0.1);
        --border-mid: rgba(255, 255, 255, 0.24);

        --signal: #4f7cff;
        --signal-soft: rgba(79, 124, 255, 0.12);

        --amber: #f5a623;
        --fault: #ff5c5c;

        --ink: #f2f4f8;
        --ink-muted: #8a93a6;
        --ink-dim: #4a5364;

        --sans:
          "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
      }

      * {
        box-sizing: border-box;
      }

      .main-scrollbar {
        scrollbar-color: var(--border-mid) transparent;
        scrollbar-width: thin;
      }

      .body {
        height: calc(100vh - 2px);
        margin: 0px;
        border: solid 1px var(--border-dim);
        background: var(--void);
        color: var(--ink);
      }

      .font-style {
        font-family: var(--sans);
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        font-size: 13px;
      }

      button {
        font-family: inherit;
      }

      .app {
        display: contents;
      }
    </style>
  </head>

  <body
    data-sveltekit-preload-data="hover"
    class="body font-style"
  >
    <div class="app">%sveltekit.body%</div>
  </body>
</html>
